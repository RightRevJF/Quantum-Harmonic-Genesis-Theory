<title>Luthier Songwriting Engine</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one phone-width column, a workbench of cards; the manifest rides on top like a tuning label. */
:root {
  --bg: #eef1ed;          /* spruce top, cool */
  --surface: #ffffff;
  --ink: #1a1d1a;         /* ebony */
  --muted: #5a645c;
  --line: #d5dcd4;
  --accent: #2b6a5d;      /* fretboard inlay green */
  --accent-ink: #ffffff;
  --accent-soft: #dcebe6;
  --brass: #8f6418;
  --floor: #a8392a; --floor-soft: #f7e3df;
  --flag: #8a6200;  --flag-soft: #f6ecd2;
  --info: #3f5f7f;  --info-soft: #e2eaf2;
  --ok: #2f7a4b;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121512; --surface: #1a1e1a; --ink: #e6ebe4; --muted: #9aa69c; --line: #2c342d;
  --accent: #6cc0ab; --accent-ink: #0d1a16; --accent-soft: #1d332d; --brass: #d8ad5c;
  --floor: #f08a78; --floor-soft: #3a1f1a; --flag: #e3b54e; --flag-soft: #352a12; --info: #93b6da; --info-soft: #1c2733; --ok: #74c793;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121512; --surface: #1a1e1a; --ink: #e6ebe4; --muted: #9aa69c; --line: #2c342d;
  --accent: #6cc0ab; --accent-ink: #0d1a16; --accent-soft: #1d332d; --brass: #d8ad5c;
  --floor: #f08a78; --floor-soft: #3a1f1a; --flag: #e3b54e; --flag-soft: #352a12; --info: #93b6da; --info-soft: #1c2733; --ok: #74c793;
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body); }
.wrap { max-width: 720px; margin: 0 auto; padding-block: 20px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; }
h1, h2 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(2rem, 7vw, 3rem); line-height: 1.05; font-weight: 700; }
h2 { font-size: 1.3rem; font-weight: 600; }
p { margin: 0; }
.eyebrow, .label { font: 500 0.72rem/1.3 var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.lede { font-size: 1.05rem; color: var(--muted); max-width: 60ch; }
.intro { display: grid; gap: 14px; padding-block: 12px 4px; }
.actions, .row { display: flex; gap: 10px; align-items: center; }
.row.wrap, .actions { flex-wrap: wrap; }
.btn { font: 600 0.95rem/1 var(--body); padding: 12px 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; min-height: 44px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.small { padding: 8px 12px; min-height: 36px; font-size: 0.85rem; }
.btn.ghost { background: transparent; }
.link { background: none; border: 0; color: var(--accent); font: 500 0.92rem var(--body); cursor: pointer; padding: 6px 0; justify-self: start; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.seeds { display: grid; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: 0.88rem/1.3 var(--body); padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-align: left; }
.chip:hover { border-color: var(--accent); }
.songs, .about { display: grid; gap: 10px; }
.songlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.songrow { width: 100%; text-align: left; display: grid; gap: 2px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); color: var(--ink); cursor: pointer; }
.songrow:hover { border-color: var(--accent); }
.songtitle { font-weight: 600; }
.songmeta, .fine, small { color: var(--muted); font-size: 0.82rem; }
.empty { color: var(--muted); }
.facts { margin: 0; padding-left: 18px; display: grid; gap: 6px; max-width: 64ch; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.songname { font-family: var(--display); font-weight: 600; text-align: right; min-width: 0; overflow-wrap: anywhere; }
.stepper { list-style: none; margin: 0; padding: 0; display: flex; gap: 4px; }
.stepper li { flex: 1; height: 6px; border-radius: 3px; background: var(--line); position: relative; }
.stepper li.done { background: var(--accent); }
.stepper li.now { background: var(--brass); }
.stepper li span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.manifest { border: 1px dashed var(--line); border-radius: var(--r); background: var(--surface); }
.manifest-head { width: 100%; display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 10px 12px; background: none; border: 0; cursor: pointer; color: var(--ink); text-align: left; }
.manifest-head code { font: 0.76rem/1.4 var(--mono); color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.toggle { font: 500 0.75rem var(--mono); color: var(--accent); flex: none; }
.manifest dl { margin: 0; padding: 0 12px 12px; display: grid; grid-template-columns: max-content 1fr; gap: 6px 12px; font-size: 0.88rem; }
.manifest dt { color: var(--muted); }
.manifest dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.alert { background: var(--flag-soft); color: var(--ink); border-left: 3px solid var(--flag); padding: 10px 12px; border-radius: 6px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 12px; min-width: 0; }
.q { font-size: 1.35rem; }
.help { color: var(--muted); max-width: 62ch; }
.stack { display: grid; gap: 16px; }
.answer { display: grid; gap: 10px; }
textarea, input, select { width: 100%; font: 1rem/1.5 var(--body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; }
textarea:focus, input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.lyricbox { font: 0.98rem/1.6 var(--mono); min-height: 340px; }
.options { display: grid; gap: 8px; }
.option { display: grid; grid-template-columns: 30px 1fr; gap: 4px 10px; align-items: start; text-align: left; padding: 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); color: var(--ink); cursor: pointer; font: 0.98rem/1.4 var(--body); }
.option:hover { border-color: var(--accent); }
.option.rec { border-color: var(--brass); }
.letter { font: 600 0.85rem/26px var(--mono); width: 26px; height: 26px; text-align: center; border-radius: 6px; background: var(--accent-soft); color: var(--accent); }
.otext { min-width: 0; overflow-wrap: anywhere; }
.recmark { grid-column: 2; font: 500 0.7rem var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--brass); }
.candnote { display: block; margin-top: 4px; font-family: var(--mono); font-size: 0.75rem; }
.contract { display: grid; gap: 12px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font-weight: 600; font-size: 0.9rem; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.busy .thinking { color: var(--muted); }
.stream, .record { font: 0.85rem/1.55 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; max-height: 50vh; overflow: auto; color: var(--muted); }
.record { color: var(--ink); max-height: none; }
.revise { display: grid; gap: 8px; }
.summary { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { font: 600 0.8rem/1 var(--mono); padding: 7px 10px; border-radius: 999px; }
.pill.floor { background: var(--floor-soft); color: var(--floor); }
.pill.flag { background: var(--flag-soft); color: var(--flag); }
.pill.info { background: var(--info-soft); color: var(--info); }
.pill.zero { background: var(--accent-soft); color: var(--ok); }
.metrics { margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.metric { border-top: 1px solid var(--line); padding-top: 8px; min-width: 0; }
.metric dt { font: 500 0.72rem var(--mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.metric dd { margin: 2px 0 0; display: grid; font-variant-numeric: tabular-nums; }
.metric b { font: 600 1.15rem var(--display); }
.lines { display: grid; gap: 14px; }
.sec { display: grid; gap: 2px; }
.secname { font: 500 0.75rem var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
.ln { display: grid; grid-template-columns: 26px 1fr 54px; gap: 8px; align-items: center; padding: 3px 6px; border-radius: 6px; border-left: 3px solid transparent; }
.ln.floor { background: var(--floor-soft); border-left-color: var(--floor); }
.ln.flag { background: var(--flag-soft); border-left-color: var(--flag); }
.ln.info { border-left-color: var(--info); }
.syl { font: 600 0.8rem var(--mono); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.ltext { min-width: 0; overflow-wrap: anywhere; font-size: 0.93rem; }
.meter { position: relative; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.meter .fill { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 3px; }
.meter .tick { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--ink); opacity: 0.5; }
.findings { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.finding { border-left: 3px solid var(--info); padding: 8px 0 8px 12px; display: grid; gap: 4px; }
.finding.floor { border-left-color: var(--floor); }
.finding.flag { border-left-color: var(--flag); }
.finding.kept { opacity: 0.6; }
.fhead { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-weight: 600; }
.lvl { font: 600 0.7rem var(--mono); text-transform: uppercase; letter-spacing: 0.08em; }
.finding.floor .lvl { color: var(--floor); } .finding.flag .lvl { color: var(--flag); } .finding.info .lvl { color: var(--info); }
.fwhere { font: 0.82rem var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.ffix { color: var(--accent); }
.keptmark { font: 500 0.75rem var(--mono); color: var(--muted); }
.coach .orig { font-family: var(--mono); color: var(--muted); text-decoration: line-through; }
.verdict { border-left: 3px solid var(--accent); padding-left: 12px; display: grid; gap: 6px; }
.verdict.no { border-left-color: var(--floor); } .verdict.partly { border-left-color: var(--flag); }
.facts2 { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: 0.9rem; }
.facts2 dt { color: var(--muted); }
.facts2 dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.progress { display: grid; gap: 6px; }
.progress .track { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.progress .fill { height: 100%; background: var(--accent); width: 0; }
.deaths { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; font: 0.85rem var(--mono); }
.deaths li { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px dotted var(--line); padding: 3px 0; }
.num { font-variant-numeric: tabular-nums; color: var(--muted); }
.candhead { display: flex; align-items: baseline; gap: 10px; }
.rank { font: 700 1.6rem var(--display); color: var(--brass); }
.rollwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.roll { display: block; }
.roll .bar { stroke: var(--line); stroke-width: 1; }
.roll .brk { stroke: var(--flag); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0.7; }
.roll .nt { fill: var(--accent); }
.roll .nt.peak { fill: var(--brass); }
.roll .nt.money { fill: var(--ink); }
.roll .chordname { fill: var(--muted); font: 600 10px var(--mono); }
.roll .syltext { fill: var(--ink); font: 9px var(--body); }
.secrow { display: grid; gap: 4px; }
.chords { display: flex; flex-wrap: wrap; gap: 6px; }
.chordchip { display: grid; min-width: 56px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); text-align: center; }
.chordchip b { font: 600 1rem var(--display); }
.chordchip small { font: 0.7rem var(--mono); }
.chordchip.du1 { border-color: var(--info); background: var(--info-soft); }
.chordchip.du2 { border-color: var(--flag); background: var(--flag-soft); }
.chordchip.du3 { border-color: var(--floor); background: var(--floor-soft); }
.card.recd { border-color: var(--brass); }
.mini { margin: 0; padding-left: 18px; font-size: 0.85rem; color: var(--muted); display: grid; gap: 2px; }
.dumap { display: grid; gap: 6px; }
.dubars { display: flex; align-items: flex-end; gap: 3px; min-height: 50px; padding: 4px 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
.dub { flex: 0 0 10px; background: var(--accent-soft); border-radius: 2px 2px 0 0; }
.dub.hook { background: var(--accent); }
.dub.over { background: var(--floor); }
.floorchip { font: 600 0.82rem var(--mono); padding: 8px 10px; border-radius: 8px; }
.floorchip.ok { background: var(--accent-soft); color: var(--ok); }
.floorchip.bad { background: var(--floor-soft); color: var(--floor); }
.floorview { display: grid; gap: 14px; }
.fgroup { display: grid; gap: 6px; }
.fchecks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.fcheck { display: grid; grid-template-columns: 92px 1fr; gap: 2px 10px; padding: 6px 0; border-bottom: 1px dotted var(--line); }
.fcheck > small { grid-column: 2; }
.fstate { font: 600 0.68rem/1.6 var(--mono); text-transform: uppercase; letter-spacing: 0.06em; grid-row: span 3; }
.fcheck.pass .fstate { color: var(--ok); } .fcheck.info .fstate { color: var(--info); } .fcheck.flag .fstate { color: var(--flag); } .fcheck.floor .fstate { color: var(--floor); }
.fname { min-width: 0; overflow-wrap: anywhere; }
.abcpreview { background: #fff; border-radius: 8px; padding: 8px; overflow-x: auto; color: #000; }
.abcpreview svg { max-width: 100%; height: auto; }
.maptable { overflow-x: auto; }
.maptable table { border-collapse: collapse; font-size: 0.8rem; min-width: 100%; }
.maptable th, .maptable td { padding: 4px; text-align: center; border-bottom: 1px solid var(--line); }
.maptable thead th { font: 600 0.7rem var(--mono); color: var(--muted); white-space: nowrap; }
.maptable tbody th { text-align: left; font-weight: 600; white-space: nowrap; }
.lev { font: 0.75rem var(--mono); padding: 6px 6px; min-width: 56px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--muted); cursor: pointer; }
.lev-sparse, .lev-brush, .lev-intro, .lev-fade, .lev-quiet { background: var(--accent-soft); color: var(--ink); }
.lev-on, .lev-light, .lev-pre { background: var(--accent); color: var(--accent-ink); opacity: 0.75; }
.lev-full, .lev-max { background: var(--accent); color: var(--accent-ink); }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 0.9rem; }
.check input { width: auto; margin-top: 3px; }
.arc { display: grid; gap: 4px; }
.arcrow { display: grid; grid-template-columns: 110px 1fr 32px; gap: 8px; align-items: center; font-size: 0.85rem; }
.arcname { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.arcbar { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; }
.arcfill { display: block; height: 100%; background: var(--brass); }
.arcdyn { font: 600 0.75rem var(--mono); color: var(--muted); }
.mini li.warn { color: var(--flag); }
details summary { cursor: pointer; color: var(--accent); font-weight: 500; padding: 4px 0; }
.status { font: 0.75rem var(--mono); color: var(--muted); text-align: center; padding: 0 16px 24px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div id="app"><main class="wrap"><p class="eyebrow">Luthier v45 · songwriting engine</p><h1>Start with one line.</h1><p class="lede">Loading the engine…</p></main></div>
<p id="status" class="status"></p>
